[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "recipe-agent-ai"
version = "0.1.0"
description = "AI-powered recipe suggestions, scaling, and shopping lists — built on Claude claude-sonnet-4-6."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = ["anthropic", "claude", "recipes", "ai", "cooking"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "anthropic>=0.40.0",
    "click>=8.1",
    "rich>=13.0",
]

[project.scripts]
recipe-agent = "recipe_agent.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov",
    "ruff",
    "mypy",
]

[tool.hatch.build.targets.wheel]
packages = ["recipe_agent"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
